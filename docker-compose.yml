# 一键起容器：后端 :8000 + 前端 :8080
#
#   docker compose up -d --build
#   打开 http://localhost:8080
#
# 前置：
#   1. 先准备好 backend/.env（照 .env.example 填 DEEPSEEK_API_KEY）
#   2. 本地模型（bge-small-zh / Erlangshen）放在 backend/data/models，
#      首次跑请先在宿主机执行 scripts/fetch_model.ps1 与 fetch_emotion_model.py，
#      或者把 data/models 一起挂进去（下面是挂整个 data 目录，模型自然带进去）
#
# 注意：本机未安装 Docker，这份 compose 是给服务器部署准备的脚手架，未实测。

services:
  backend:
    build: ./backend
    image: novelchat-backend
    env_file:
      - ./backend/.env
    # 数据库、原文、模型、贴纸都在 data 里：挂出来，升级镜像不丢数据
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: novelchat-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped